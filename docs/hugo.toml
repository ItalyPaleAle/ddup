# Generated by vercel-docs-build from config.json — do not edit by hand.
baseURL = "https://ddup.italypaleale.me/"
locale = "en-us"
title = "ddup"
disableKinds = ["rss"]
enableRobotsTXT = true

[module]
  [module.hugoVersion]
    extended = true
    min = '0.164.0'
  [[module.mounts]]
    source = "../screenshot.webp"
    target = "assets/img/screenshot.webp"

  [[module.imports]]
    path = "github.com/italypaleale/hugo-assets"

# Required for render hooks + unsafe HTML in markdown
[markup]
  [markup.highlight]
    noClasses = false
    style = "github"
    lineNos = false
    lineNumbersInTable = false
    guessSyntax = true
    tabWidth = 2
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[params]
  description = "Health-checked DNS records for failover and round-robin load balancing"
  github_url = "https://github.com/italypaleale/ddup"
  github_repo = "https://github.com/italypaleale/ddup"
  github_branch = "main"
  github_path = "docs"
  PlausibleAnalytics = true

  [params.robots]
    llmsTXT = true

  [params.theme]
    scheme = "blue"
    icon_light = "icon-light.svg"
    icon_dark = "icon-dark.svg"
    favicon = "favicon.svg"

# Taxonomy pages aren't needed for a docs site
[taxonomies]

# Output HTML and Markdown for AI agents
# "notfound" is the theme's markdown 404 body, published at /404.md
[outputs]
  home    = ["html", "markdown", "notfound"]
  section = ["html", "markdown"]
  page    = ["html", "markdown"]
